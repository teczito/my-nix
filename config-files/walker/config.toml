# walker 2.x configuration.
#
# Migrated 2026-09-04 from the walker 0.13 config that used to live here (see
# git history for it). Almost nothing carried over as-is: the 0.13 file was
# upstream's stock config, and every key in it -- `app_launch_prefix`,
# `[keys]`, `[list]`, `[search]`, the whole `[builtins.*]` tree -- was either
# renamed or moved out of walker entirely in 2.x. Providers in particular are
# no longer configured here at all: they live in the `elephant` daemon
# (services.elephant.enable in configuration.nix), which walker queries over
# $XDG_RUNTIME_DIR/elephant/elephant.sock.
#
# walker embeds its own defaults (resources/config.toml in the source) and
# merges this file over them, so only deviations belong here. A key it does not
# recognise is not an error -- it is silently dropped -- which is exactly why
# the old file kept "working" while doing nothing.
#
# Reference for every available key:
#   nix build .#nixosConfigurations.nixos.pkgs.walker.src
#   cat result/resources/config.toml

# Carried over from the 0.13 config, where this was false. Upstream 2.x
# defaults it to true, i.e. pressing Mod+P again closes walker instead of
# being a no-op. Flip it if the old behaviour was not deliberate.
close_when_open = false

theme = "nixos"

# 0.13 spelled these `[search].placeholder` and `[list].placeholder`.
[placeholders]
"default" = { input = "Search...", list = "No Results" }
