# Colours carried over from the gnome-terminal profile that used to be the
# awesome `terminal`. Taken verbatim from dconf, profile
# :b1dcc9dd-5262-4d8d-a863-c897e6d979b9, which had use-theme-colors=false and
# so ran on these explicit values rather than on the GTK theme:
#
#   dconf dump /org/gnome/terminal/
#
# That profile set only background-color, foreground-color and palette; cursor
# and selection were left unset, i.e. derived from fg/bg, which is what the two
# blocks below reproduce.

background              #171421
foreground              #d0cfcc

# gnome-terminal leaves cursor-colors-set false, so the cursor takes the
# foreground colour. kitty's own default is #cccccc, hence the override.
cursor                  #d0cfcc

# highlight-colors-set is false too: selection is a straight fg/bg inversion.
selection_foreground    #171421
selection_background    #d0cfcc

# palette[0..7] — normal
color0                  #171421
color1                  #c01c28
color2                  #26a269
color3                  #a2734c
color4                  #12488b
color5                  #a347ba
color6                  #2aa1b3
color7                  #d0cfcc

# palette[8..15] — bright
color8                  #5e5c64
color9                  #f66151
color10                 #33d17a
color11                 #e9ad0c
color12                 #2a7bde
color13                 #c061cb
color14                 #33c7de
color15                 #ffffff
